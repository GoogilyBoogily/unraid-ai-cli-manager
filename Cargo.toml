[package]
name = "ai-cli-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Root-native AI command line tool persistence for Unraid"
repository = "https://github.com/GoogilyBoogily/unraid-ai-cli-manager"

[features]
test-support = []

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
clap = { version = "=4.6.7", features = ["derive"] }
thiserror = "=2.0.21"
toml_edit = "=0.25.19"
rustix = { version = "=1.1.6", features = ["fs", "process"] }
rusqlite = { version = "=0.42.0", default-features = false, features = ["backup", "bundled"] }
tempfile = "=3.27.0"

[[bin]]
name = "ai-cli-manager"
path = "src/main.rs"

[profile.release]
lto = "thin"
strip = true


name: Draft release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools rsync php-cli
          rustup toolchain install 1.96.0 --profile minimal --component clippy --component rustfmt --target x86_64-unknown-linux-musl
      - name: Verify and package
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets --features test-support -- -D warnings
          cargo test --locked --features test-support
          php -n -l unraid/include/actions.php
          node --check unraid/scripts/settings.js
          packaging/build.sh
          cargo test --locked --features test-support --test packaging -- --include-ignored
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: draft-package
          path: dist/
          if-no-files-found: error
  draft:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: draft-package
          path: dist/
      - name: Create reviewable draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' Cargo.toml | head -n1)
          gh release create "v$version" dist/* --draft --prerelease --target "$GITHUB_SHA" --title "AI CLI Manager $version desktop preview" --notes-file docs/release-notes.md

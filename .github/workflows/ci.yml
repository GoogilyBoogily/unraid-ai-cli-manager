name: Desktop checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install desktop build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools rsync php-cli
          rustup toolchain install 1.96.0 --profile minimal --component clippy --component rustfmt --target x86_64-unknown-linux-musl
      - name: Check Rust
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets --features test-support -- -D warnings
          cargo clippy --locked --all-targets --no-default-features -- -D warnings
          cargo test --locked --features test-support
          cargo test --locked --no-default-features
      - name: Check PHP and entry points
        run: |
          php -n -l unraid/include/request.php
          php -n -l unraid/include/actions.php
          node --check unraid/scripts/settings.js
          bash -n packaging/build.sh
          for entry in unraid/event/* unraid/plugin-post-hook; do sh -n "$entry"; done
      - name: Build static package
        run: |
          packaging/build.sh
          cargo test --locked --features test-support --test packaging -- --include-ignored
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-preview
          path: dist/
          if-no-files-found: error
